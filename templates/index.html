<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogi Kérdés-Válasz Rendszer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">
            <i class="fas fa-balance-scale me-2"></i>
            Jogi Kérdés-Válasz Rendszer
        </h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <div class="mb-4">
                            <button id="loadDocs" class="btn btn-primary">
                                <i class="fas fa-file-import me-2"></i>
                                Dokumentumok betöltése
                            </button>
                            <div id="loadStatus" class="mt-2"></div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="question" class="form-label">
                                <i class="fas fa-question-circle me-2"></i>
                                Kérdés:
                            </label>
                            <textarea id="question" class="form-control" rows="3" 
                                    placeholder="Írja be kérdését a jogi dokumentumokkal kapcsolatban..."></textarea>
                        </div>
                        
                        <button id="askButton" class="btn btn-success">
                            <i class="fas fa-paper-plane me-2"></i>
                            Kérdés feltétele
                        </button>
                        
                        <div id="answer" class="mt-4">
                            <h5>
                                <i class="fas fa-comment-dots me-2"></i>
                                Válasz:
                            </h5>
                            <div id="answerText" class="p-3 bg-light rounded"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loadDocs').addEventListener('click', async () => {
            const statusDiv = document.getElementById('loadStatus');
            const button = document.getElementById('loadDocs');
            const originalText = button.innerHTML;
            
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Betöltés folyamatban...';
            statusDiv.innerHTML = '';
            
            try {
                const response = await fetch('/load_documents', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    statusDiv.innerHTML = `<div class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>${data.message}</div>`;
                } else {
                    statusDiv.innerHTML = `<div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>${data.message}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>Hiba történt: ${error.message}</div>`;
            } finally {
                button.disabled = false;
                button.innerHTML = originalText;
            }
        });

        document.getElementById('askButton').addEventListener('click', async () => {
            const question = document.getElementById('question').value;
            const answerDiv = document.getElementById('answerText');
            const button = document.getElementById('askButton');
            const originalText = button.innerHTML;
            
            if (!question) {
                answerDiv.innerHTML = `<div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>Kérlek adj meg egy kérdést!</div>`;
                return;
            }
            
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Válasz generálása...';
            answerDiv.innerHTML = '<div class="text-center"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    answerDiv.innerHTML = data.answer;
                } else {
                    answerDiv.innerHTML = `<div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>${data.message}</div>`;
                }
            } catch (error) {
                answerDiv.innerHTML = `<div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>Hiba történt: ${error.message}</div>`;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
